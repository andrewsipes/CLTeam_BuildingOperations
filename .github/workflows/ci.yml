name: PR CI

on:
  pull_request:
    branches: [preview, main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        # `npm ci` is recommended for pipelines/CI - explaination is here: https://docs.npmjs.com/cli/v10/commands/npm-ci?v=true
        run: npm ci --no-audit
      - name: Type-check frontend
        # Run TypeScript type-checking for the frontend using the `typecheck` script defined in package.json
        run: npm run typecheck
      - name: Build and lint
        run: npm run build
      - name: Run frontend tests
        # https://jestjs.io/docs/cli#--watchall - `false` will prevent interactive watching, and instead run once
        run: npm test -- --watchAll=false
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  backend:
    name: API build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/backend.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore and audit NuGet dependencies
        # NuGet audit docs: https://learn.microsoft.com/en-us/nuget/concepts/auditing-packages#configuring-nuget-audit
        # look for high level severities for now
        run: >-
          dotnet restore backend/backend.csproj
          -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high
          '-warnaserror:NU1900;NU1903;NU1904;NU1905'
      - name: Build API with analyzers
        # Run source code analysis at build time for .net: https://learn.microsoft.com/en-us/visualstudio/code-quality/disable-code-analysis?view=visualstudio
        run: dotnet build backend/backend.csproj --configuration Release --no-restore -p:RunAnalyzersDuringBuild=true

  compose:
    name: Compose smoke test and image scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: building-operations-ci
      NPM_REGISTRY: ''
      NUGET_SOURCE: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the Compose stack
        id: compose-up
        run: docker compose up --build --wait --wait-timeout 60
      - name: Smoke-test frontend and API
        shell: bash
        # all curl args can be found at https://www.man7.org/linux/man-pages/man1/curl.1.html which explains the below
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --retry-max-time 45 --max-time 5 \
            --output /dev/null http://127.0.0.1:8090/
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --retry-max-time 45 --max-time 5 \
            http://127.0.0.1:8080/weatherforecast | jq -e 'type == "array" and length > 0' >/dev/null
      - name: Scan frontend image with Trivy
        if: ${{ !cancelled() && steps.compose-up.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'building-operations-ci-frontend'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Scan API image with Trivy
        if: ${{ !cancelled() && steps.compose-up.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'building-operations-ci-backend'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the Compose stack
        if: always()
        run: docker compose down

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        # gitleaks GitHub Actions requires a license key for org repos, but not personal ones - docs: https://github.com/gitleaks/gitleaks-action#questions
        # to avoid passing a key here, to be safe, we can just use this via CLI
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="--full-history -m HEAD" --redact --no-banner
